name: windows-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Lumin
        shell: cmd
        run: >
          msbuild examples\example_win32_directx11\example_win32_directx11.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /v:minimal
          /nologo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Recurse -Filter example_win32_directx11.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist\Lumin.exe
          Copy-Item data dist\data -Recurse

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Lumin-win-x64
          path: dist
