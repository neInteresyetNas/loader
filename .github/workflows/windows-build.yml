name: windows-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Eclipse
        shell: cmd
        run: >
          msbuild examples\example_win32_directx11\example_win32_directx11.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /v:minimal
          /nologo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $names = @('Eclipse.exe','Lumin.exe','example_win32_directx11.exe')
          $exe = Get-ChildItem -Path examples -Recurse -Filter *.exe |
                 Where-Object { $names -contains $_.Name -and $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw "exe not found" }
          Write-Host "Found: $($exe.FullName)"
          Copy-Item $exe.FullName dist\Eclipse.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-win-x64
          path: dist
